<style>
:root {
  --basalt: #161a1f;
  --slate: #20262d;
  --slate-2: #29313a;
  --line: #333c46;
  --bone: #ece6d6;
  --muted: #8f98a2;
  --radiant: #5fc48a;
  --dire: #d9583f;
  --gold: #d8b25a;
  --gold-ink: #241c08;
  --safe-bottom: max(env(safe-area-inset-bottom), var(--tg-safe-area-inset-bottom, 0px));
  --display: "Unbounded", "Manrope", system-ui, sans-serif;
  --body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--basalt); color: var(--bone); }
body {
  font: 15px/1.5 var(--body);
  min-height: 100vh;
  overscroll-behavior-y: none;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
img { display: block; }

#view {
  max-width: 560px;
  margin: 0 auto;
  padding: 16px 16px calc(96px + var(--safe-bottom));
}

/* ---------- typography ---------- */
h1, h2, h3 { margin: 0; font-weight: 700; }
.title { font: 700 22px/1.2 var(--display); letter-spacing: -0.01em; }
.section-title { font: 600 17px/1.3 var(--body); margin: 28px 0 12px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-family: var(--display); font-variant-numeric: tabular-nums; }

/* ---------- surfaces ---------- */
.panel { background: var(--slate); border-radius: 18px; padding: 16px; }
.panel + .panel { margin-top: 12px; }
.row { display: flex; align-items: center; gap: 12px; }
.grow { flex: 1; min-width: 0; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- buttons & inputs ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 0; border-radius: 12px; padding: 13px 18px;
  font-weight: 700; background: var(--gold); color: var(--gold-ink);
  width: 100%;
}
.btn:active { transform: scale(0.98); }
.btn.ghost { background: transparent; color: var(--bone); border: 1px solid var(--line); }
.btn[disabled] { opacity: 0.5; }
.link-btn { background: none; border: 0; padding: 0; color: var(--gold); font-weight: 600; }
.field {
  width: 100%; border: 1px solid var(--line); background: var(--basalt);
  border-radius: 12px; padding: 13px 14px; outline: none;
}
.field:focus { border-color: var(--gold); }
.search { position: sticky; top: 0; z-index: 5; background: var(--basalt); padding: 4px 0 12px; }

/* ---------- bottom nav ---------- */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: rgba(22, 26, 31, 0.92);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  padding: 6px 8px calc(6px + var(--safe-bottom));
  display: flex; justify-content: center;
}
nav.tabs .inner { display: grid; grid-template-columns: repeat(5, 1fr); width: 100%; max-width: 560px; }
nav.tabs button {
  background: none; border: 0; padding: 6px 0; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 600;
}
nav.tabs svg { width: 24px; height: 24px; }
nav.tabs button[aria-current="page"] { color: var(--bone); }
nav.tabs button[aria-current="page"] svg { color: var(--gold); }

/* ---------- hero art ---------- */
.portrait { width: 64px; aspect-ratio: 16 / 9; border-radius: 8px; object-fit: cover; background: var(--slate-2); flex: none; }
.portrait.lg { width: 96px; }
.hero-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.hero-tile { background: none; border: 0; padding: 0; text-align: left; }
.hero-tile img { width: 100%; aspect-ratio: 16 / 9; border-radius: 10px; object-fit: cover; background: var(--slate-2); }
.hero-tile span { display: block; font-size: 12px; font-weight: 600; margin-top: 4px; line-height: 1.25; }
.banner {
  position: relative; margin: -16px -16px 0; height: 190px; overflow: hidden;
  background: var(--slate-2);
}
.banner img { width: 100%; height: 100%; object-fit: cover; object-position: center 25%; }
.banner::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(22,26,31,0) 35%, var(--basalt) 100%);
}
.banner .caption { position: absolute; left: 16px; right: 16px; bottom: 10px; z-index: 1; }

/* ---------- profile ---------- */
.avatar { width: 64px; height: 64px; border-radius: 16px; object-fit: cover; background: var(--slate-2); }
.rank { display: inline-flex; align-items: center; gap: 8px; margin-top: 4px; font-weight: 600; }
.pips { display: inline-flex; gap: 3px; }
.pips i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
.pips i.on { background: var(--gold); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
.stat { background: var(--basalt); border-radius: 12px; padding: 10px 12px; }
.stat b { display: block; font: 700 19px/1.2 var(--display); }
.stat span { font-size: 12px; color: var(--muted); }
.list-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
.row-btn { width: 100%; background: none; border: 0; padding-left: 0; padding-right: 0; text-align: left; }
.list-row + .list-row { border-top: 1px solid var(--line); }
.tips { margin: 0; padding: 0; list-style: none; }
.tips li { position: relative; padding-left: 18px; margin: 8px 0; }
.tips li::before { content: ""; position: absolute; left: 2px; top: 9px; width: 6px; height: 6px; border-radius: 2px; background: var(--gold); transform: rotate(45deg); }

/* ---------- the Radiant/Dire scale ---------- */
.scale { margin: 18px 0 0; }
.scale-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.scale-head b { font: 700 16px/1 var(--display); font-variant-numeric: tabular-nums; }
.track {
  position: relative; height: 10px; margin-top: 10px; border-radius: 99px;
  background: linear-gradient(90deg, var(--dire) 0%, #8a6a45 50%, var(--radiant) 100%);
  opacity: 0.9;
}
.track::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 2px; background: var(--basalt); }
.marker {
  position: absolute; top: 50%; width: 20px; height: 20px; margin-left: -10px; margin-top: -10px;
  border-radius: 50%; background: var(--bone); border: 4px solid var(--basalt);

.scale-foot { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 6px; }
.scale-note { font-size: 13px; margin-top: 6px; }

/* ---------- coach report ---------- */
.winrate { display: flex; align-items: flex-end; gap: 12px; margin-top: 18px; }
.winrate .num { font-size: 56px; font-weight: 800; line-height: 0.9; letter-spacing: -0.03em; }
.problem { border-left: 4px solid var(--dire); }
.problem h3 { font: 700 18px/1.3 var(--display); margin: 4px 0 6px; }
.good { border-left: 4px solid var(--radiant); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--slate-2); border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
.chip.dire { color: #f2a08f; }
.chip.radiant { color: #9fe0bb; }
.kda { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; margin-top: 14px; }
.kda b { display: block; font: 700 20px/1.2 var(--display); }
.kda span { font-size: 12px; color: var(--muted); }
.strip { display: flex; gap: 10px; overflow-x: auto; margin: 0 -16px; padding: 0 16px 4px; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.strip .hero-tile { width: 112px; flex: none; }
.strip .hero-tile small { display: block; font-size: 12px; color: var(--muted); }

/* ---------- segmented control ---------- */
.segmented { display: grid; grid-template-columns: 1fr 1fr; background: var(--slate); border-radius: 12px; padding: 4px; margin: 16px 0; }
.segmented button { border: 0; background: none; padding: 9px; border-radius: 9px; font-weight: 700; color: var(--muted); }
.segmented button[aria-pressed="true"] { background: var(--slate-2); color: var(--bone); }

/* ---------- counters & builds ---------- */
.wr-bar { height: 6px; border-radius: 99px; background: var(--slate-2); margin-top: 6px; overflow: hidden; }
.wr-bar i { display: block; height: 100%; border-radius: 99px; }
.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 10px; }
.item { text-align: center; font-size: 11px; line-height: 1.25; color: var(--muted); }
.item img { width: 100%; aspect-ratio: 88 / 64; border-radius: 8px; object-fit: cover; background: var(--slate-2); margin-bottom: 4px; }

/* ---------- matches ---------- */
.match { display: grid; grid-template-columns: 4px 64px 1fr auto; align-items: center; gap: 12px; padding: 10px 0; width: 100%; background: none; border: 0; text-align: left; }
.match + .match { border-top: 1px solid var(--line); }
.match .side { align-self: stretch; border-radius: 4px; }
.match .farm { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 4px; vertical-align: 0; }

/* ---------- plans ---------- */
.plan { position: relative; }
.plan.current { outline: 2px solid var(--gold); outline-offset: -2px; }
.plan .price { font: 700 24px/1.2 var(--display); margin: 6px 0 4px; }
.badge { position: absolute; right: 14px; top: 14px; background: var(--gold); color: var(--gold-ink); border-radius: 99px; padding: 3px 10px; font-size: 12px; font-weight: 700; }

/* ---------- states ---------- */
.loader { display: flex; align-items: center; gap: 12px; padding: 32px 4px; color: var(--muted); }
.spin { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--gold); animation: spin 0.8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty { text-align: center; padding: 40px 12px; }
.empty .title { margin-bottom: 8px; }
.empty p { margin: 0 0 18px; color: var(--muted); }
.toast {
  position: fixed; left: 50%; bottom: calc(84px + var(--safe-bottom)); transform: translateX(-50%);
  background: var(--slate-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px;
  font-size: 14px; z-index: 30; max-width: calc(100% - 32px);
}
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
.brand svg { width: 28px; height: 28px; color: var(--gold); }
.brand b { font: 800 16px/1 var(--display); letter-spacing: 0.02em; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

const store = {
  get(key) {

        tg.CloudStorage.getItem(key, (err, value) => resolve(err ? null : value || null));

// ---------------------------------------------------------------- api
const cache = new Map();

class ApiError extends Error {}

async function od(path, params = {}) {
  const qs = new URLSearchParams();
  for (const [k, v] of Object.entries(params)) {
    (Array.isArray(v) ? v : [v]).forEach((x) => x !== undefined && x !== null && qs.append(k, x));
  }
  const url = `${API}${path}${qs.toString() ? "?" + qs : ""}`;
  if (cache.has(url)) return cache.get(url);

  const promise = (async () => {
    let resp;
    try {
      resp = await fetch(url);
    } catch (e) {
      throw new ApiError("Нет связи с OpenDota. Проверь интернет и попробуй ещё раз.");
    }
    if (resp.status === 429) throw new ApiError("OpenDota просит подождать: слишком много запросов. Попробуй через минуту.");
    if (!resp.ok) throw new ApiError(`OpenDota ответил ошибкой ${resp.status}. Попробуй позже.`);
    return resp.json();
  })();
  cache.set(url, promise);
  promise.catch(() => cache.delete(url));
  return promise;
}

async function pool(items, limit, fn) {
  const out = new Array(items.length);
  let i = 0;
  const workers = Array.from({ length: Math.min(limit, items.length) }, async () => {
    while (i < items.length) { const idx = i++; out[idx] = await fn(items[idx]); }
  });
  await Promise.all(workers);
  return out;
}

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const imgTag = (src, cls, alt = "") => `<img class="${cls}" src="${esc(src)}" alt="${esc(alt)}" loading="lazy" onerror="this.style.visibility='hidden'">`;

function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}

const RANKS = { 1: "Рекрут", 2: "Страж", 3: "Рыцарь", 4: "Герой", 5: "Легенда", 6: "Властелин", 7: "Божество", 8: "Титан" };

function rankInfo(rankTier, leaderboard) {
  if (!rankTier) return { name: "Ранг скрыт или не откалиброван", stars: 0, major: 0 };
  const major = Math.floor(rankTier / 10), stars = rankTier % 10;
  let name = RANKS[major] || "?";
  if (major === 8 && leaderboard) name += ` #${leaderboard}`;
  return { name, stars: major === 8 ? 0 : stars, major };
}

function parseAccountId(text) {
  text = text.trim();
  let m = text.match(/steamcommunity\.com\/profiles\/(\d{17})/);
  if (m) return Number(BigInt(m[1]) - STEAM64_BASE);
  if (/steamcommunity\.com\/id\//.test(text)) return "vanity";
  m = text.match(/(?:opendota|dotabuff|stratz)\.com\/players\/(\d+)/);
  if (m) return Number(m[1]);
  if (/^\d+$/.test(text)) {
    if (text.length === 17 && BigInt(text) > STEAM64_BASE) return Number(BigInt(text) - STEAM64_BASE);
    const n = Number(text);
    if (n > 0 && n < 2 ** 32) return n;
  }
  return null;
}

function heroMatches(hero, query) {
  const q = query.trim().toLowerCase();
  if (!q) return true;
  const name = hero.localized_name.toLowerCase();
  if (name.includes(q)) return true;
  for (const [alias, target] of Object.entries(ALIASES)) {
    if (target === hero.localized_name && alias.startsWith(q)) return true;
  }
  return false;
}

  xpm: { bench: "xp_per_min", label: "Опыт в минуту (XPM)" },

const PROBLEMS = {

  hdm: ["мало урона по героям", [

    "Используй способности на героях, а не только на крипах.",
    "К середине игры держись ближе к команде."]],
  deaths: ["слишком много смертей", [
    "Смотри на миникарту каждые 3–5 секунд.",
    "Не фарми дальнюю линию без обзора, когда враги пропали с карты.",
    "Собери сейв-предмет по ситуации: BKB, Blink, Glimmer Cape или Force Staff."]],
  decisions: ["личная статистика хорошая, но побед мало", [
    "Скорее всего, дело в решениях: когда пушить, драться и идти на Рошана.",
    "Получив преимущество, переводи его в вышки, а не в лишний фарм.",
    "Пересмотри повторы своих поражений с 15-й по 30-ю минуту."]],
};
const WEAK_PCT = 0.40, STRONG_PCT = 0.65, HIGH_DEATHS = 7.0;

const isWin = (m) => ((m.player_slot || 0) < 128) === Boolean(m.radiant_win);

function percentileOf(value, bench) {
  if (!bench || !bench.length) return null;
  const pts = bench.filter((p) => p.value !== null && p.value !== undefined)
    .map((p) => [p.percentile, p.value]).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  if (!pts.length) return null;
  if (value <= pts[0][1]) {
    const [p0, v0] = pts[0];
    return v0 > 0 ? Math.max(0, p0 * value / v0) : p0;
  }
  for (let i = 0; i < pts.length - 1; i++) {
    const [p1, v1] = pts[i], [p2, v2] = pts[i + 1];
    if (value <= v2) return v2 === v1 ? p2 : p1 + (p2 - p1) * (value - v1) / (v2 - v1);
  }
  return pts[pts.length - 1][0];
}

function matchMetrics(m) {
  const minutes = (m.duration || 0) / 60;
  if (minutes < 10) return null;
  return {
    gpm: m.gold_per_min || 0,
    xpm: m.xp_per_min || 0,
    lhm: (m.last_hits || 0) / minutes,
    hdm: (m.hero_damage || 0) / minutes,
  };
}

function analyze(matches, benchmarks) {
  const rows = matches.map((m) => [m, matchMetrics(m)]).filter(([, mm]) => mm);
  if (!rows.length) return null;
  const n = rows.length;
  const wins = rows.filter(([m]) => isWin(m)).length;
  const avg = {};
  for (const k of Object.keys(METRICS)) avg[k] = rows.reduce((s, [, mm]) => s + mm[k], 0) / n;
  const kda = ["kills", "deaths", "assists"].map((k) => rows.reduce((s, [m]) => s + (m[k] || 0), 0) / n);
  const avgMinutes = rows.reduce((s, [m]) => s + m.duration, 0) / n / 60;

  const pctMap = {};
  for (const [k, meta] of Object.entries(METRICS)) {
    const p = percentileOf(avg[k], benchmarks[meta.bench]);
    if (p !== null) pctMap[k] = p;
  }
  const report = { games: n, wins, winrate: wins / n, avg, pct: pctMap, kda, avgMinutes, problems: [], strengths: [] };

  for (const [k, p] of Object.entries(pctMap)) {
    if (p < WEAK_PCT) report.problems.push({ key: k, title: PROBLEMS[k][0], advice: PROBLEMS[k][1], severity: WEAK_PCT - p + 0.1 });
    else if (p >= STRONG_PCT) report.strengths.push(k);
  }
  if (kda[1] >= HIGH_DEATHS) {
    report.problems.push({ key: "deaths", title: PROBLEMS.deaths[0], advice: PROBLEMS.deaths[1], severity: (kda[1] - 5) / 10 });
  }
  if (!report.problems.length && n >= 5 && report.winrate < 0.45) {
    report.problems.push({ key: "decisions", title: PROBLEMS.decisions[0], advice: PROBLEMS.decisions[1], severity: 0.1 });
  }
  report.problems.sort((a, b) => b.severity - a.severity);
  return report;
}

function syncBackButton() {
  if (!tg || !tg.BackButton) return;
  if (state.stack.length) tg.BackButton.show(); else tg.BackButton.hide();
}

function go(tab) {
  state.tab = tab; state.stack = [];
  renderTabs(); render();
}
function push(screen) { state.stack.push(screen); render(); }
function back() { state.stack.pop(); render(); }

if (tg && tg.BackButton) tg.BackButton.onClick(back);

async function render() {
  const token = ++renderToken;
  syncBackButton();
  const top = state.stack[state.stack.length - 1];
  const guard = () => token === renderToken;
  try {
    if (top) {
      if (top.type === "hero") return await renderHero(top, guard);
      if (top.type === "report") return await renderReport(top, guard);
    }
    if (state.tab === "profile") return await renderProfile(guard);
    if (state.tab === "coach") return await renderCoach(guard);
    if (state.tab === "heroes") return await renderHeroes(guard);
    if (state.tab === "matches") return await renderMatches(guard);
    if (state.tab === "plans") return renderPlans();
  } catch (e) {
    if (!guard()) return;
    console.error(e);
    setView(errorBlock(e instanceof ApiError ? e.message : "Что-то пошло не так. Попробуй ещё раз."));
  }
}

      <p class="small muted" style="margin:6px 0 0">Выбери героя ниже — я возьму более старые игры.</p></div>`}

    <h2 class="section-title">Другой герой</h2>
    <input class="field" id="coach-search" placeholder="Имя героя: Tinker, тинкер, па…" autocomplete="off">
    <div class="hero-grid" id="coach-results" style="margin-top:12px"></div>`);

  const input = document.getElementById("coach-search");
  const results = document.getElementById("coach-results");
  input.addEventListener("input", () => {
    const q = input.value;
    const list = q.trim() ? Object.values(heroes).filter((h) => heroMatches(h, q)).slice(0, 12) : [];
    results.innerHTML = list.map((h) => `<button class="hero-tile" data-report="${h.id}">${imgTag(heroImg(h), "", h.localized_name)}<span>${esc(h.localized_name)}</span></button>`).join("");
  });
}

function scaleBlock(key, value, p) {
  const shown = key === "lhm" ? value.toFixed(1) : Math.round(value).toLocaleString("ru-RU");
  if (p === null || p === undefined) {
    return `<div class="scale"><div class="scale-head"><span>${esc(METRICS[key].label)}</span><b>${shown}</b></div>
      <p class="scale-note muted">Нет данных для сравнения.</p></div>`;
  }
  const note = p < WEAK_PCT ? "ниже большинства" : p >= STRONG_PCT ? "выше большинства" : "на среднем уровне";
  return `<div class="scale">
    <div class="scale-head"><span>${esc(METRICS[key].label)}</span><b>${shown}</b></div>
    <div class="track" role="img" aria-label="Лучше, чем у ${pct(p)}% игроков"><span class="marker" style="--p:${Math.min(98, Math.max(2, pct(p)))}%"></span></div>
    <p class="scale-note">Лучше, чем у <b>${pct(p)}%</b> игроков на этом герое — ${note}.</p>
  </div>`;
}

async function renderReport(screen, guard) {
  const heroes = await api.heroes();
  const hero = heroes[screen.heroId] || { localized_name: "герой" };
  setView(loader(`Разбираю твои матчи на ${hero.localized_name}…`));
  const [matches, bench] = await Promise.all([
    api.matches(state.accountId, 20, screen.heroId),
    api.benchmarks(screen.heroId),
  ]);
  if (!guard()) return;
  const r = analyze(matches || [], bench);

  if (!r || r.games < 3) {
    setView(`
      <div class="banner">${imgTag(heroImg(hero), "", hero.localized_name)}<div class="caption"><h1 class="title">${esc(hero.localized_name)}</h1></div></div>
      <div class="empty"><div class="title">Мало матчей</div>
      <p>Для разбора нужно хотя бы 3 игры дольше 10 минут на этом герое. Выбери другого героя.</p>
      <button class="btn ghost" data-action="back">Выбрать героя</button></div>`);
    return;
  }

  const main = r.problems[0];
  const [k, d, a] = r.kda;
  setView(`
    <div class="banner">${imgTag(heroImg(hero), "", hero.localized_name)}
      <div class="caption"><h1 class="title">${esc(hero.localized_name)}</h1>
      <span class="small muted">${r.games} ${plural(r.games, "матч", "матча", "матчей")}, в среднем ${Math.round(r.avgMinutes)} мин</span></div>
    </div>

    <div class="winrate">
      <span class="num" style="color:${r.winrate >= 0.5 ? "var(--radiant)" : "var(--dire)"}">${pct(r.winrate)}%</span>
      <span class="muted" style="padding-bottom:4px">винрейт<br>${r.wins} ${plural(r.wins, "победа", "победы", "побед")} из ${r.games}</span>
    </div>

    ${main ? `
      <div class="panel problem" style="margin-top:20px">
        <span class="small muted">Главная проблема</span>
        <h3>${esc(main.title[0].toUpperCase() + main.title.slice(1))}</h3>
        <ul class="tips">${main.advice.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>
      </div>
      ${r.problems.length > 1 ? `<div class="chips" style="margin-top:12px">${r.problems.slice(1).map((p) => `<span class="chip dire">${esc(p.title)}</span>`).join("")}</div>` : ""}
    ` : `
      <div class="panel good" style="margin-top:20px">
        <h3 style="font:700 18px/1.3 var(--display);margin:0 0 6px">Явных слабых мест нет</h3>
        <p class="muted" style="margin:0">На этом герое ты играешь лучше большинства. Так держать.</p>
      </div>`}

    <h2 class="section-title">Ты против других игроков на ${esc(hero.localized_name)}</h2>
    <div class="panel" style="padding-top:2px">
      ${Object.keys(METRICS).map((key) => scaleBlock(key, r.avg[key], r.pct[key])).join("")}
      <div class="scale-foot" style="margin-top:14px"><span>хуже всех</span><span>середина</span><span>лучше всех</span></div>
    </div>

    <div class="panel">
      <b>Убийства, смерти, помощь</b>
      <div class="kda">
        <div><b>${k.toFixed(1)}</b><span>убийства</span></div>
        <div><b style="color:${d >= HIGH_DEATHS ? "var(--dire)" : "inherit"}">${d.toFixed(1)}</b><span>смерти</span></div>
        <div><b>${a.toFixed(1)}</b><span>помощь</span></div>
      </div>
    </div>
    ${r.games < 10 ? `<p class="small muted" style="margin-top:14px">Матчей пока меньше десяти, поэтому разбор приблизительный.</p>` : ""}
    <button class="btn ghost" style="margin-top:16px" data-hero="${screen.heroId}">Контрпики и сборка ${esc(hero.localized_name)}</button>`);
}

// ---------------------------------------------------------------- heroes
async function renderHeroes(guard) {
  setView(loader("Загружаю героев…"));
  const heroes = await api.heroes();
  if (!guard()) return;
  const all = Object.values(heroes).sort((a, b) => a.localized_name.localeCompare(b.localized_name));

  setView(`
    <h1 class="title">Герои</h1>
    <p class="muted" style="margin:8px 0 12px">Контрпики и популярные сборки по статистике OpenDota.</p>
    <div class="search"><input class="field" id="hero-search" placeholder="Поиск: Pudge, пудж, сф…" value="${esc(state.heroQuery)}" autocomplete="off"></div>
    <div class="hero-grid" id="hero-grid"></div>`);

  const grid = document.getElementById("hero-grid");
  const input = document.getElementById("hero-search");
  const draw = () => {
    state.heroQuery = input.value;
    const list = all.filter((h) => heroMatches(h, input.value));
    grid.innerHTML = list.length
      ? list.map((h) => `<button class="hero-tile" data-hero="${h.id}">${imgTag(heroImg(h), "", h.localized_name)}<span>${esc(h.localized_name)}</span></button>`).join("")
      : `<p class="muted">Такого героя не нашёл. Попробуй английское имя.</p>`;
  };
  input.addEventListener("input", draw);
  draw();
}

const STAGES = [
  ["start_game_items", "Старт"], ["early_game_items", "Ранняя игра"],
  ["mid_game_items", "Середина игры"], ["late_game_items", "Поздняя игра"],
];

async function renderHero(screen, guard) {
  const heroes = await api.heroes();
  const hero = heroes[screen.heroId];
  const tab = screen.tab || "counters";
  const head = `
    <div class="banner">${imgTag(heroImg(hero), "", hero.localized_name)}
      <div class="caption"><h1 class="title">${esc(hero.localized_name)}</h1>
      ${hero.roles ? `<span class="small muted">${esc(hero.roles.slice(0, 3).join(", "))}</span>` : ""}</div>
    </div>
    <div class="segmented" role="group" aria-label="Раздел">
      <button data-hero-tab="counters" aria-pressed="${tab === "counters"}">Контрпики</button>
      <button data-hero-tab="build" aria-pressed="${tab === "build"}">Сборка</button>
    </div>`;
  setView(head + loader("Считаю статистику…"));

  if (tab === "counters") {
    const data = await api.matchups(screen.heroId);
    if (!guard()) return;
    const rows = (data || []).filter((m) => m.games_played >= 20)
      .map((m) => ({ wr: m.wins / m.games_played, games: m.games_played, hero: heroes[m.hero_id] }))
      .filter((r) => r.hero).sort((a, b) => a.wr - b.wr);
    if (rows.length < 6) return setView(head + `<p class="muted">По этому герою пока мало данных о матч-апах.</p>`);
    const line = (r) => {
      const color = r.wr < 0.5 ? "var(--dire)" : "var(--radiant)";
      return `<button class="list-row row-btn" data-hero="${r.hero.id}">
        ${imgTag(heroImg(r.hero), "portrait", r.hero.localized_name)}
        <div class="grow"><b class="ellipsis" style="display:block">${esc(r.hero.localized_name)}</b>
          <div class="wr-bar"><i style="width:${pct(r.wr)}%;background:${color}"></i></div></div>
        <div style="text-align:right"><b class="num" style="color:${color}">${pct(r.wr)}%</b><br><span class="small muted">${r.games} игр</span></div>
      </button>`;
    };
    setView(head + `
      <h2 class="section-title" style="margin-top:4px">Кем контрить ${esc(hero.localized_name)}</h2>
      <p class="small muted" style="margin:-6px 0 8px">Против этих героев у него самый низкий винрейт.</p>
      <div class="panel" style="padding-top:4px;padding-bottom:4px">${rows.slice(0, 6).map(line).join("")}</div>
      <h2 class="section-title">Кого ${esc(hero.localized_name)} контрит сам</h2>
      <div class="panel" style="padding-top:4px;padding-bottom:4px">${rows.slice().reverse().slice(0, 6).map(line).join("")}</div>
      <p class="small muted" style="margin-top:12px">Процент — винрейт ${esc(hero.localized_name)} против этого героя.</p>`);
  } else {
    const [pop, items] = await Promise.all([api.itemPopularity(screen.heroId), api.items()]);
    if (!guard()) return;
    const blocks = STAGES.map(([key, title]) => {
      const stage = (pop && pop[key]) || {};
      const top = Object.entries(stage).sort((a, b) => b[1] - a[1]).slice(0, 8)
        .map(([id]) => items[id]).filter((it) => it && it.dname);
      if (!top.length) return "";
      return `<h2 class="section-title">${title}</h2>
        <div class="items">${top.map((it) => `<div class="item">${imgTag(itemImg(it), "", it.dname)}${esc(it.dname)}</div>`).join("")}</div>`;
    }).join("");
    setView(head + (blocks || `<p class="muted">Нет данных о предметах для этого героя.</p>`) +
      `<p class="small muted" style="margin-top:16px">Самые частые покупки игроков на этом герое.</p>`);
  }
}

// ---------------------------------------------------------------- matches
async function renderMatches(guard) {
  if (!state.accountId) return needAccount();
  setView(loader("Загружаю последние матчи…"));
  const [matches, heroes] = await Promise.all([api.matches(state.accountId, 20), api.heroes()]);
  if (!guard()) return;
  if (!matches || !matches.length) {
    return setView(`<div class="empty"><div class="title">Матчей не видно</div>
      <p>Включи «Публичная история матчей» в настройках Dota 2 и сыграй хотя бы одну игру.</p></div>`);
  }
  const heroIds = [...new Set(matches.map((m) => m.hero_id))];
  const benches = {};
  await pool(heroIds, 4, async (h) => { benches[h] = await api.benchmarks(h); });
  if (!guard()) return;

  let wins = 0; const farm = [];
  const rows = matches.map((m) => {
    const won = isWin(m); if (won) wins++;
    const hero = heroes[m.hero_id] || {};
    const mm = matchMetrics(m);
    const p = mm ? percentileOf(mm.gpm, benches[m.hero_id] && benches[m.hero_id].gold_per_min) : null;
    if (p !== null) farm.push(p);
    const farmColor = p === null ? "var(--line)" : p >= 0.6 ? "var(--radiant)" : p >= 0.35 ? "var(--gold)" : "var(--dire)";
    const date = new Date((m.start_time || 0) * 1000).toLocaleDateString("ru-RU", { day: "numeric", month: "short" });
    return `<button class="match" data-open="https://www.opendota.com/matches/${m.match_id}">
      <span class="side" style="background:${won ? "var(--radiant)" : "var(--dire)"}"></span>
      ${imgTag(heroImg(hero), "portrait", hero.localized_name)}
      <div style="min-width:0"><b class="ellipsis" style="display:block">${esc(hero.localized_name || "?")}</b>
        <span class="small muted">${won ? "Победа" : "Поражение"}, ${date}, ${Math.round((m.duration || 0) / 60)} мин</span></div>
      <div style="text-align:right"><b class="num">${m.kills}/${m.deaths}/${m.assists}</b><br>
        <span class="small muted"><i class="farm" style="background:${farmColor}"></i>GPM ${m.gold_per_min || 0}</span></div>
    </button>`;
  });
  const avgFarm = farm.length ? farm.reduce((s, x) => s + x, 0) / farm.length : null;

  setView(`
    <h1 class="title">Последние матчи</h1>
    <div class="stats">
      <div class="stat"><b>${wins} из ${matches.length}</b><span>побед</span></div>
      <div class="stat"><b style="color:${wins / matches.length >= 0.5 ? "var(--radiant)" : "var(--dire)"}">${pct(wins / matches.length)}%</b><span>винрейт</span></div>
      <div class="stat"><b>${avgFarm === null ? "—" : pct(avgFarm) + "%"}</b><span>фарм лучше, чем у</span></div>
    </div>
    <p class="small muted" style="margin:14px 0 4px">Цвет точки у GPM — фарм в сравнении с другими игроками на этом герое: зелёный выше среднего, жёлтый средний, красный ниже. Нажми на матч, чтобы открыть его на OpenDota.</p>
    <div>${rows.join("")}</div>`);
}

  { code: "pro", title: "Pro", price: "150 ⭐ в месяц", perks: ["Всё из Free", "Тренер: 15 разборов в неделю по 50 матчам", "Анализ последних 10 матчей"] },
  { code: "premium", title: "Premium", price: "350 ⭐ в месяц", perks: ["Всё из Pro", "Тренер без лимитов, по 100 матчам", "Анализ последних 20 матчей", "Ранний доступ к новым функциям"] },
];

    ${PLANS.map((p) => `

        <b style="font-size:17px">${p.title}</b>

    <p class="small muted" style="margin-top:16px">DOTA MIND не связан с Valve. Dota 2 — товарный знак Valve Corporation.</p>`);

// ---------------------------------------------------------------- events
document.addEventListener("click", async (ev) => {
  const el = ev.target.closest("button");
  if (!el) return;
  const d = el.dataset;
  if (d.tab) { haptic(); return go(d.tab); }
  if (d.tabGo) { haptic(); return go(d.tabGo); }
  if (d.hero) { haptic(); return push({ type: "hero", heroId: Number(d.hero), tab: "counters" }); }
  if (d.report) { haptic(); return push({ type: "report", heroId: Number(d.report) }); }
  if (d.heroTab) {
    const top = state.stack[state.stack.length - 1];
    if (top && top.tab !== d.heroTab) { haptic(); top.tab = d.heroTab; render(); }
    return;
  }
  if (d.open) return openLink(d.open);
  if (d.buy) {
    haptic();
    return alertBox("Оплата звёздами Telegram появится в ближайшем обновлении. Пока все функции открыты бесплатно.");
  }
  if (d.action === "retry") return render();
  if (d.action === "back") return back();
  if (d.action === "rebind") {
    state.accountId = null;
    await store.set("account_id", "");
    return go("profile");
  }
});

// ---------------------------------------------------------------- start
(async function init() {
  renderTabs();
  setView(loader("Запускаю DOTA MIND…"));
  const saved = await store.get("account_id");
  state.accountId = saved ? Number(saved) : null;
  render();
})();
</script>
